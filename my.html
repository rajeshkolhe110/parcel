<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parcel Label Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?
family=Roboto&
family=Poppins&
family=Open+Sans&
family=Lato&
family=Montserrat&
family=Noto+Serif&
family=Merriweather&
family=Courier+Prime&
display=swap" rel="stylesheet">

<style>
/* ================= UI ================= */
body {
  font-family: Roboto, sans-serif;
  background: #eef1f5;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,.1);
}

label {
  font-weight: bold;
  margin-top: 12px;
  display: block;
}

textarea, input, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 14px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 14px;
}

.buttons {
  text-align: center;
  margin-top: 20px;
}

button {
  padding: 10px 26px;
  font-size: 15px;
  border-radius: 8px;
  border: none;
  background: #007bff;
  color: white;
  cursor: pointer;
}
button:hover { background:#0056b3; }

.preview-container {
  margin-top: 30px;
  display: flex;
  justify-content: center;
}

/* ============ LABEL ============ */
.label-page {
  width: 210mm;
  background: white;
}

.label-content {
  padding: 60px;   /* px only */
  box-sizing: border-box;
}

.label-content h3 {
  margin: 0 0 6px 0;
  font-weight: bold;
}

.label-content p {
  margin: 0;
  white-space: pre-wrap;
}

/* ============ PRINT SAFETY ============ */
@media print {
  body { background:none; padding:0; }
  .container { display:none; }
}
</style>
</head>

<body>

<div class="container">
<h2>Parcel Label Generator</h2>

<label>To:</label>
<input id="toSearch" placeholder="Search saved address">
<select id="savedAddresses" onchange="loadSavedAddress()">
  <option value="">-- Select Saved Address --</option>
</select>
<textarea id="toText" placeholder="Enter recipient address"></textarea>

<label>From:</label>
<textarea id="fromText">AutoMekz Electronics,
Flat No.2 Ram Heights, Laxmi Nagar,
Mahale Farm, Cidco, Nashik,
Maharashtra
Pincode:- 422009
Contact:- 9503298303 / 9765300065</textarea>

<div class="controls">
  <div>
    <label>Font</label>
    <select id="fontFamily">
      <option value="Times New Roman">Times New Roman</option>
      <option value="Roboto" selected>Roboto</option>
      <option value="Poppins">Poppins</option>
      <option value="Open Sans">Open Sans</option>
      <option value="Lato">Lato</option>
      <option value="Montserrat">Montserrat</option>
      <option value="Noto Serif">Noto Serif</option>
      <option value="Merriweather">Merriweather</option>
      <option value="Courier Prime">Courier Prime</option>
      <option value="Arial">Arial</option>
    </select>
  </div>

  <div>
    <label>Font Size (pt)</label>
    <input type="number" id="fontSize" value="16">
  </div>

  <div>
    <label>Line Spacing</label>
    <input type="number" id="lineSpacing" value="1" step="0.1">
  </div>

  <div>
    <label>Gap (px)</label>
    <input type="number" id="gapBetween" value="20">
  </div>
</div>

<div class="buttons">
  <button onclick="savePDF()">Save PDF</button>
  <button onclick="printPDF()">Save & Print PDF</button>
</div>
</div>

<div class="preview-container">
<div class="label-page" id="labelPage">
  <div class="label-content" id="labelContent">
    <h3>To,</h3>
    <p id="previewTo"></p>
    <div id="gap"></div>
    <h3>From,</h3>
    <p id="previewFrom"></p>
  </div>
</div>
</div>

<script>
/* ================= STORAGE ================= */
const STORAGE_KEY = "parcel_saved_addresses_v1";
const LEGACY_KEYS = ["savedToAddresses", "addr"];
/* ================= GOOGLE SHEETS POST ================= */

const GOOGLE_SHEET_API =
  "https://script.google.com/macros/s/AKfycbx3CA8K8IgD5X0heh1Z6jIcmzdqubyXtwM_0XGHAar-PJAznq5BIumIbsgIYtM9FOAh/exec";

let sheetPostInProgress = false;

async function saveRecipientToSheet() {
  const address = toText.value.trim();

  if (!address) {
    alert("Please enter recipient address");
    return;
  }

  if (sheetPostInProgress) {
    console.log("POST already in progress");
    return;
  }

  sheetPostInProgress = true;

  try {
    await fetch(GOOGLE_SHEET_API, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify({
        address: address
      })
    });

    console.log("Recipient POST sent to Google Sheets");

  } catch (error) {
    console.error("Google Sheets POST failed:", error);
    alert("Unable to send recipient address to Google Sheets.");

  } finally {
    sheetPostInProgress = false;
  }
}

/* ============== GOOGLE SHEETS ADDRESS LIST ============== */

let sheetAddresses = [];

function fetchSheetAddresses() {
  return new Promise((resolve, reject) => {
    const callbackName =
      "sheetCallback_" + Date.now() + "_" +
      Math.floor(Math.random() * 10000);

    const script = document.createElement("script");

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("Google Sheets address loading timed out"));
    }, 15000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = function(data) {
      cleanup();

      sheetAddresses = Array.isArray(data)
        ? [...new Set(data.filter(a => typeof a === "string" && a.trim()))]
        : [];

      loadList();
      resolve(sheetAddresses);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error("Could not load addresses from Google Sheets"));
    };

    script.src =
      GOOGLE_SHEET_API +
      "?callback=" + encodeURIComponent(callbackName);

    document.body.appendChild(script);
  });
}
  
function migrateOldAddresses() {
  let merged = [];
  merged.push(...JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

  LEGACY_KEYS.forEach(k => {
    merged.push(...JSON.parse(localStorage.getItem(k) || "[]"));
  });

  const unique = [];
  merged.forEach(a => {
    if (a && !unique.some(u => u.toLowerCase() === a.toLowerCase())) {
      unique.push(a);
    }
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(unique));
}

/* ================= PREVIEW ================= */
function updatePreview() {
  labelContent.style.fontFamily = fontFamily.value;
  labelContent.style.fontSize = fontSize.value + "pt";
  labelContent.style.lineHeight = lineSpacing.value;
  gap.style.height = gapBetween.value + "px";

  previewTo.textContent = toText.value;
  previewFrom.textContent = fromText.value;
}

/* ================= ADDRESS BOOK ================= */
function saveAddress() {
  const txt = toText.value.trim();
  if (!txt) return;

  let arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (!arr.some(a => a.toLowerCase() === txt.toLowerCase())) {
    arr.push(txt);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }
  loadList();
}

function loadList() {
  savedAddresses.innerHTML =
    `<option value="">-- Select Saved Address --</option>`;

  const search = toSearch.value.trim().toLowerCase();

  sheetAddresses.forEach((address, i) => {
    if (!search || address.toLowerCase().includes(search)) {
      const option = document.createElement("option");

      option.value = i;
      option.textContent = address.split("\n")[0];
      option.title = address;

      savedAddresses.appendChild(option);
    }
  });
}

function loadSavedAddress() {
  const i = savedAddresses.value;

  if (i === "") return;

  toText.value = sheetAddresses[Number(i)];

  updatePreview();
}

/* ================= PDF ================= */
async function savePDF() {
  updatePreview();
  saveAddress();

  await saveRecipientToSheet();

  html2pdf().set({
    margin: 10,
    html2canvas: { scale: 2 },
    jsPDF: {
      unit: "mm",
      format: "a4",
      orientation: "portrait"
    },
    pagebreak: { mode: "avoid-all" }
  }).from(labelPage).save("Parcel_Label.pdf");
}

async function printPDF() {
  updatePreview();
  saveAddress();

  await saveRecipientToSheet();

  html2pdf().set({
    margin: 10,
    html2canvas: { scale: 2 },
    jsPDF: {
      unit: "mm",
      format: "a4",
      orientation: "portrait"
    },
    pagebreak: { mode: "avoid-all" }
  }).from(labelPage).outputPdf("blob").then(blob => {
    const url = URL.createObjectURL(blob);
    const w = window.open(url);

    if (w) {
      w.onload = () => w.print();
    }
  });
}

/* ================= EVENTS ================= */
document.querySelectorAll("input,textarea,select")
  .forEach(e => e.addEventListener("input", updatePreview));

toSearch.addEventListener("input", loadList);

window.onload = async () => {
  migrateOldAddresses();

  loadList();
  updatePreview();

  try {
    await fetchSheetAddresses();
    console.log("Google Sheets addresses loaded:", sheetAddresses.length);
  } catch (error) {
    console.error(error);
    alert("Unable to load addresses from Google Sheets.");
  }
};
</script>

</body>
</html>
