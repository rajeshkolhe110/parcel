<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parcel Label Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>
/* ================= UI ================= */
body {
  font-family: Roboto, sans-serif;
  background: #eef1f5;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,.1);
}

label {
  font-weight: bold;
  margin-top: 12px;
  display: block;
}

textarea, input, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 14px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-size: 14px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
  gap: 14px;
}

.buttons {
  text-align: center;
  margin-top: 20px;
}

button {
  padding: 10px 26px;
  font-size: 15px;
  border-radius: 8px;
  border: none;
  background: #007bff;
  color: white;
  cursor: pointer;
}
button:hover { background:#0056b3; }

.preview-container {
  margin-top: 30px;
  display: flex;
  justify-content: center;
}

/* ============ LABEL (NO A4 HEIGHT) ============ */
.label-page {
  width: 210mm;          /* Width only */
  background: white;
}

.label-content {
  padding: 60px;         /* px ONLY (important) */
  box-sizing: border-box;
}

.label-content h3 {
  margin: 0 0 6px 0;
  font-weight: bold;
}

.label-content p {
  margin: 0;
  white-space: pre-wrap;
}

/* ============ PRINT SAFETY ============ */
@media print {
  body { background:none; padding:0; }
  .container { display:none; }
}
</style>
</head>

<body>

<div class="container">
<h2>Parcel Label Generator</h2>

<label>To:</label>
<input id="toSearch" placeholder="Search saved address">
<select id="savedAddresses" onchange="loadSavedAddress()">
  <option value="">-- Select Saved Address --</option>
</select>
<textarea id="toText" placeholder="Enter recipient address"></textarea>

<label>From:</label>
<textarea id="fromText">AutoMekz Electronics,
Flat No.2 Ram Heights, Laxmi Nagar,
Mahale Farm, Cidco, Nashik,
Maharashtra
Pincode:- 422009
Contact:- 9503298303 / 9765300065</textarea>

<div class="controls">
  <div>
    <label>Font</label>
    <select id="fontFamily">
      <option>Times New Roman</option>
      <option selected>Roboto</option>
      <option>Arial</option>
    </select>
  </div>
  <div>
    <label>Font Size (pt)</label>
    <input type="number" id="fontSize" value="16">
  </div>
  <div>
    <label>Line Spacing</label>
    <input type="number" id="lineSpacing" value="1" step="0.1">
  </div>
  <div>
    <label>Gap (px)</label>
    <input type="number" id="gapBetween" value="20">
  </div>
</div>

<div class="buttons">
  <button onclick="savePDF()">Save PDF</button>
  <button onclick="printPDF()">Save & Print PDF</button>
</div>
</div>

<div class="preview-container">
<div class="label-page" id="labelPage">
  <div class="label-content" id="labelContent">
    <h3>To,</h3>
    <p id="previewTo"></p>
    <div id="gap"></div>
    <h3>From,</h3>
    <p id="previewFrom"></p>
  </div>
</div>
</div>

<script>
/* ================= STORAGE ================= */
const STORAGE_KEY = "parcel_saved_addresses_v1";
const LEGACY_KEYS = ["savedToAddresses", "addr"];

/* Restore old saved addresses */
function migrateOldAddresses() {
  let merged = [];

  const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  merged.push(...current);

  LEGACY_KEYS.forEach(k => {
    const old = JSON.parse(localStorage.getItem(k) || "[]");
    merged.push(...old);
  });

  const unique = [];
  merged.forEach(a => {
    if (a && !unique.some(u => u.toLowerCase() === a.toLowerCase())) {
      unique.push(a);
    }
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(unique));
}

/* ================= PREVIEW ================= */
function updatePreview() {
  labelContent.style.fontFamily = fontFamily.value;
  labelContent.style.fontSize = fontSize.value + "pt";
  labelContent.style.lineHeight = lineSpacing.value;
  gap.style.height = gapBetween.value + "px";

  previewTo.textContent = toText.value;
  previewFrom.textContent = fromText.value;
}

/* ================= ADDRESS BOOK ================= */
function saveAddress() {
  const txt = toText.value.trim();
  if (!txt) return;

  let arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  if (!arr.some(a => a.toLowerCase() === txt.toLowerCase())) {
    arr.push(txt);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }
  loadList();
}

function loadList() {
  savedAddresses.innerHTML =
    `<option value="">-- Select Saved Address --</option>`;

  const search = toSearch.value.toLowerCase();
  const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

  arr.forEach((a, i) => {
    const first = a.trim().split(/\s+/)[0].toLowerCase();
    if (!search || first.includes(search)) {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = a.split("\n")[0];
      savedAddresses.appendChild(o);
    }
  });
}

function loadSavedAddress() {
  const i = savedAddresses.value;
  if (i === "") return;

  const arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  toText.value = arr[i];
  updatePreview();
}

/* ================= PDF ================= */
function savePDF() {
  updatePreview();
  saveAddress();

  html2pdf().set({
    margin: 10,
    html2canvas: { scale: 2 },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    pagebreak: { mode: "avoid-all" }
  }).from(labelPage).save("Parcel_Label.pdf");
}

function printPDF() {
  updatePreview();
  saveAddress();

  html2pdf().set({
    margin: 10,
    html2canvas: { scale: 2 },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    pagebreak: { mode: "avoid-all" }
  }).from(labelPage).outputPdf("blob").then(blob => {
    const url = URL.createObjectURL(blob);
    const w = window.open(url);
    if (w) {
      w.onload = () => w.print();
    }
  });
}

/* ================= EVENTS ================= */
document.querySelectorAll("input,textarea,select")
  .forEach(e => e.addEventListener("input", updatePreview));

toSearch.addEventListener("input", loadList);

window.onload = () => {
  migrateOldAddresses();   // restores ALL old entries
  loadList();
  updatePreview();
};
</script>

</body>
</html>
