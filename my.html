<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parcel Label Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<style>
body {
  font-family: Roboto, sans-serif;
  background: #eef1f5;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,.1);
}

label {
  font-weight: bold;
  margin-top: 12px;
  display: block;
}

textarea, input, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 14px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
}

.buttons {
  text-align: center;
  margin-top: 20px;
}

button {
  padding: 10px 26px;
  font-size: 15px;
  border-radius: 8px;
  border: none;
  background: #007bff;
  color: white;
  cursor: pointer;
}
button:hover { background:#0056b3; }

.preview-container {
  margin-top: 30px;
  display: flex;
  justify-content: center;
}

/* ===== LABEL (NO A4 HEIGHT HERE) ===== */
.label-page {
  width: 210mm;          /* Width only */
  background: white;
}

.label-content {
  padding: 60px;         /* px ONLY */
  box-sizing: border-box;
}

.label-content h3 {
  margin: 0 0 6px 0;     /* Controlled margins */
  font-weight: bold;
}

.label-content p {
  margin: 0;
  white-space: pre-wrap;
}

/* Print safety */
@media print {
  body { background:none; padding:0; }
  .container { display:none; }
}
</style>
</head>

<body>

<div class="container">
<h2>Parcel Label Generator</h2>

<label>To:</label>
<input id="toSearch" placeholder="Search saved address">
<select id="savedAddresses" onchange="loadSavedAddress()">
  <option value="">-- Select Saved Address --</option>
</select>
<textarea id="toText"></textarea>

<label>From:</label>
<textarea id="fromText">AutoMekz Electronics,
Flat No.2 Ram Heights, Laxmi Nagar,
Mahale Farm, Cidco, Nashik,
Maharashtra
Pincode:- 422009
Contact:- 9503298303</textarea>

<div class="controls">
  <div>
    <label>Font</label>
    <select id="fontFamily">
      <option>Times New Roman</option>
      <option selected>Roboto</option>
      <option>Arial</option>
    </select>
  </div>
  <div>
    <label>Font Size (pt)</label>
    <input type="number" id="fontSize" value="16">
  </div>
  <div>
    <label>Line Spacing</label>
    <input type="number" id="lineSpacing" value="1" step="0.1">
  </div>
  <div>
    <label>Gap (px)</label>
    <input type="number" id="gapBetween" value="20">
  </div>
</div>

<div class="buttons">
  <button onclick="savePDF()">Save PDF</button>
  <button onclick="printPDF()">Save & Print PDF</button>
</div>
</div>

<div class="preview-container">
<div class="label-page" id="labelPage">
  <div class="label-content" id="labelContent">
    <h3>To,</h3>
    <p id="previewTo"></p>
    <div id="gap"></div>
    <h3>From,</h3>
    <p id="previewFrom"></p>
  </div>
</div>
</div>

<script>
function updatePreview() {
  const lc = labelContent;
  lc.style.fontFamily = fontFamily.value;
  lc.style.fontSize = fontSize.value + "pt";
  lc.style.lineHeight = lineSpacing.value;
  gap.style.height = gapBetween.value + "px";

  previewTo.textContent = toText.value;
  previewFrom.textContent = fromText.value;
}

function savePDF() {
  updatePreview();
  html2pdf().set({
    margin: 10,   // jsPDF margin controls page
    html2canvas: { scale: 2 },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    pagebreak: { mode: "avoid-all" }
  }).from(labelPage).save("Parcel_Label.pdf");
}

function printPDF() {
  updatePreview();
  html2pdf().set({
    margin: 10,
    html2canvas: { scale: 2 },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    pagebreak: { mode: "avoid-all" }
  }).from(labelPage).outputPdf("blob").then(b=>{
    const u=URL.createObjectURL(b);
    const w=window.open(u);
    w.onload=()=>{w.print();};
  });
}

document.querySelectorAll("input,textarea,select")
  .forEach(e=>e.addEventListener("input",updatePreview));

window.onload = updatePreview;
</script>

</body>
    </html>
