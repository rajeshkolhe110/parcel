<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parcel Label Generator Final</title>

<!-- html2pdf only for safety image -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<!-- jsPDF direct engine for parcel label -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Roboto&family=Poppins&family=Open+Sans&family=Lato&family=Montserrat&family=Noto+Serif&family=Merriweather&family=Courier+Prime&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#eef1f5;
  font-family:Roboto,sans-serif;
}

.container{
  max-width:920px;
  margin:auto;
  background:#fff;
  padding:28px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.10);
}

h2{
  margin:0 0 20px 0;
}

label{
  display:block;
  font-weight:700;
  margin-top:12px;
  margin-bottom:6px;
}

textarea,
input,
select{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:14px;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  margin-top:10px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:20px;
}

button{
  border:none;
  border-radius:8px;
  padding:12px 18px;
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:.92;
}

.blue{ background:#007bff; }
.green{ background:#11863d; }
.red{ background:#d70000; }

.preview{
  margin-top:30px;
  background:#fff;
  padding:50px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,.06);
}

.preview h3{
  margin:0 0 8px 0;
}

#previewTo,
#previewFrom{
  white-space:pre-wrap;
}

.note{
  margin-top:10px;
  color:#666;
  font-size:12px;
}

#safetyPage{
  display:none;
  width:794px;
  height:1123px;
  background:#fff url('IMG-20260424-WA0007.jpg') no-repeat center center;
  background-size:100% 100%;
}

@media(max-width:700px){
  .buttons{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="container">

<h2>Parcel Label Generator</h2>

<label>To:</label>

<input id="toSearch" placeholder="Search saved address">

<select id="savedAddresses" onchange="loadSavedAddress()">
<option value="">-- Select Saved Address --</option>
</select>

<textarea id="toText" placeholder="Enter recipient address"></textarea>

<label>From:</label>

<textarea id="fromText">AutoMekz Electronics,
Flat No.2 Ram Heights, Laxmi Nagar,
Mahale Farm, Cidco, Nashik,
Maharashtra
Pincode:- 422009
Contact:- 9503298303 / 9765300065</textarea>

<div class="controls">

<div>
<label>Font</label>
<select id="fontFamily">
<option value="helvetica" selected>Roboto / Arial</option>
<option value="times">Times</option>
<option value="courier">Courier</option>
</select>
</div>

<div>
<label>Font Size</label>
<input type="number" id="fontSize" value="18">
</div>

<div>
<label>Line Spacing</label>
<input type="number" id="lineSpacing" value="1.15" step="0.05">
</div>

<div>
<label>Gap</label>
<input type="number" id="gapBetween" value="26">
</div>

</div>

<div class="buttons">
<button class="blue" onclick="savePDF()">Save PDF</button>
<button class="green" onclick="printPDF()">Save & Print PDF</button>
<button class="red" onclick="saveSafetyPDF()">Safety Label PDF</button>
</div>

<div class="preview">

<h3>To,</h3>
<div id="previewTo"></div>

<div id="gap"></div>

<h3>From,</h3>
<div id="previewFrom"></div>

</div>

<div class="note">
Parcel PDF uses direct jsPDF engine (single page stable)
</div>

</div>

<!-- hidden safety page -->
<div id="safetyPage"></div>

<script>
const STORAGE_KEY = "parcel_saved_addresses_final";
const LEGACY_KEYS = [
  "parcel_saved_addresses_v2",
  "parcel_saved_addresses_v1",
  "savedToAddresses",
  "addr"
];

/* migrate */
function migrateOld(){

  let merged = [];

  LEGACY_KEYS.forEach(function(k){

    try{
      merged.push(...JSON.parse(localStorage.getItem(k) || "[]"));
    }catch(e){}

  });

  const unique = [];

  merged.forEach(function(a){

    if(!a) return;

    if(!unique.some(function(x){
      return x.toLowerCase() === a.toLowerCase();
    })){
      unique.push(a);
    }

  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(unique));
}

/* preview */
function updatePreview(){

  document.getElementById("previewTo").textContent =
    document.getElementById("toText").value;

  document.getElementById("previewFrom").textContent =
    document.getElementById("fromText").value;

  document.getElementById("previewTo").style.fontSize =
    document.getElementById("fontSize").value + "pt";

  document.getElementById("previewFrom").style.fontSize =
    document.getElementById("fontSize").value + "pt";

  document.getElementById("previewTo").style.lineHeight =
    document.getElementById("lineSpacing").value;

  document.getElementById("previewFrom").style.lineHeight =
    document.getElementById("lineSpacing").value;

  document.getElementById("gap").style.height =
    document.getElementById("gapBetween").value + "px";
}

/* save address */
function saveAddress(){

  const txt =
    document.getElementById("toText").value.trim();

  if(!txt) return;

  let arr = [];

  try{
    arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }catch(e){}

  if(!arr.some(function(a){
    return a.toLowerCase() === txt.toLowerCase();
  })){

    arr.push(txt);

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(arr)
    );
  }

  loadList();
}

/* list */
function loadList(){

  const sel =
    document.getElementById("savedAddresses");

  sel.innerHTML =
    '<option value="">-- Select Saved Address --</option>';

  let arr = [];

  try{
    arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }catch(e){}

  const q =
    document.getElementById("toSearch").value.toLowerCase();

  arr.forEach(function(a,i){

    const first =
      a.trim().split(/\s+/)[0].toLowerCase();

    if(!q || first.includes(q)){

      const op =
        document.createElement("option");

      op.value = i;
      op.textContent = a.split("\n")[0];

      sel.appendChild(op);
    }

  });
}

/* load selected */
function loadSavedAddress(){

  const i =
    document.getElementById("savedAddresses").value;

  if(i === "") return;

  let arr = [];

  try{
    arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }catch(e){}

  document.getElementById("toText").value =
    arr[i] || "";

  updatePreview();
}

/* create parcel pdf */
function buildParcelDoc(){

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    orientation:"portrait",
    unit:"pt",
    format:"a4"
  });

  const left = 40;
  const top = 45;
  const usableW = 595.28 - 80;

  const font =
    document.getElementById("fontFamily").value;

  const fontSize =
    parseInt(document.getElementById("fontSize").value) || 18;

  const lineSpacing =
    parseFloat(document.getElementById("lineSpacing").value) || 1.15;

  const gap =
    parseInt(document.getElementById("gapBetween").value) || 26;

  const toText =
    document.getElementById("toText").value.trim();

  const fromText =
    document.getElementById("fromText").value.trim();

  let y = top;

  doc.setFont(font,"bold");
  doc.setFontSize(fontSize + 4);
  doc.text("To,", left, y);

  y += 24;

  doc.setFont(font,"normal");
  doc.setFontSize(fontSize);

  const toLines =
    doc.splitTextToSize(toText, usableW);

  doc.text(toLines, left, y, {
    lineHeightFactor: lineSpacing
  });

  y += toLines.length * fontSize * lineSpacing + gap;

  doc.setFont(font,"bold");
  doc.setFontSize(fontSize + 4);
  doc.text("From,", left, y);

  y += 24;

  doc.setFont(font,"normal");
  doc.setFontSize(fontSize);

  const fromLines =
    doc.splitTextToSize(fromText, usableW);

  doc.text(fromLines, left, y, {
    lineHeightFactor: lineSpacing
  });

  return doc;
}

/* save parcel */
function savePDF(){

  saveAddress();
  updatePreview();

  const doc = buildParcelDoc();

  doc.save("Parcel_Label.pdf");
}

/* print parcel */
function printPDF(){

  saveAddress();
  updatePreview();

  const doc = buildParcelDoc();

  const blob = doc.output("blob");
  const url = URL.createObjectURL(blob);

  const w = window.open(url);

  if(w){
    w.onload = function(){
      w.print();
    };
  }
}

/* safety image pdf */

function saveSafetyPDF(){

  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    orientation:"portrait",
    unit:"pt",
    format:"a4"
  });

  const img = new Image();

  img.onload = function(){

    /* Exact A4 size in points */
    doc.addImage(
      img,
      "JPEG",
      0,
      0,
      595.28,
      841.89
    );

    doc.save("Handle_With_Care.pdf");
  };

  img.onerror = function(){
    alert("Image not found: IMG-20260424-WA0007.jpg");
  };

  img.src = "IMG-20260424-WA0007.jpg";
}

/* events */
document.querySelectorAll(
  "input,textarea,select"
).forEach(function(el){

  el.addEventListener(
    "input",
    updatePreview
  );

});

document.getElementById("toSearch")
.addEventListener("input", loadList);

/* init */
window.onload = function(){

  migrateOld();
  loadList();
  updatePreview();

};
</script>

</body>
</html>
