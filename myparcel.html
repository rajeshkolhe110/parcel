<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parcel Label Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Roboto&family=Poppins&family=Open+Sans&family=Lato&family=Montserrat&family=Noto+Serif&family=Merriweather&family=Courier+Prime&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#eef1f5;
  font-family:Roboto,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.10);
}

h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
  margin-bottom:6px;
}

textarea,
input,
select{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:14px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:14px;
  margin-top:8px;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:20px;
}

button{
  padding:10px 24px;
  border:none;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
}

button:hover{
  opacity:.92;
}

.blue{ background:#007bff; }
.green{ background:#0a8f3d; }
.red{ background:#d60000; }

.preview-container{
  margin-top:30px;
  display:flex;
  justify-content:center;
}

.label-page{
  width:210mm;
  min-height:297mm;
  background:#fff;
}

.label-content{
  padding:60px;
}

.label-content h3{
  margin:0 0 6px 0;
}

.label-content p{
  margin:0;
  white-space:pre-wrap;
}

/* hidden safety page */
#safetyPage{
  display:none;
  width:210mm;
  height:297mm;
  background:#fff;
  overflow:hidden;
  margin:0;
  padding:0;
}

#safetyPage img{
  width:210mm;
  height:297mm;
  display:block;
  object-fit:fill;
  margin:0;
  padding:0;
}

@media(max-width:700px){
  .buttons{
    flex-direction:column;
  }
}

@media print{
  body{
    background:#fff;
    padding:0;
  }

  .container,
  .preview-container{
    display:none !important;
  }
}
</style>
</head>

<body>

<div class="container">

<h2>Parcel Label Generator</h2>

<label>To:</label>

<input id="toSearch" placeholder="Search saved address">

<select id="savedAddresses" onchange="loadSavedAddress()">
<option value="">-- Select Saved Address --</option>
</select>

<textarea id="toText" placeholder="Enter recipient address"></textarea>

<label>From:</label>

<textarea id="fromText">AutoMekz Electronics,
Flat No.2 Ram Heights, Laxmi Nagar,
Mahale Farm, Cidco, Nashik,
Maharashtra
Pincode:- 422009
Contact:- 9503298303 / 9765300065</textarea>

<div class="controls">

<div>
<label>Font</label>
<select id="fontFamily">
<option value="Times New Roman">Times New Roman</option>
<option value="Roboto" selected>Roboto</option>
<option value="Poppins">Poppins</option>
<option value="Open Sans">Open Sans</option>
<option value="Lato">Lato</option>
<option value="Montserrat">Montserrat</option>
<option value="Noto Serif">Noto Serif</option>
<option value="Merriweather">Merriweather</option>
<option value="Courier Prime">Courier Prime</option>
<option value="Arial">Arial</option>
</select>
</div>

<div>
<label>Font Size (pt)</label>
<input type="number" id="fontSize" value="16">
</div>

<div>
<label>Line Spacing</label>
<input type="number" id="lineSpacing" value="1" step="0.1">
</div>

<div>
<label>Gap (px)</label>
<input type="number" id="gapBetween" value="20">
</div>

</div>

<div class="buttons">
<button class="blue" onclick="savePDF()">Save PDF</button>
<button class="green" onclick="printPDF()">Save & Print PDF</button>
<button class="red" onclick="printSafety()">Safety Label PDF</button>
</div>

</div>


<!-- NORMAL LABEL PREVIEW -->
<div class="preview-container">

<div class="label-page" id="labelPage">

<div class="label-content" id="labelContent">

<h3>To,</h3>
<p id="previewTo"></p>

<div id="gap"></div>

<h3>From,</h3>
<p id="previewFrom"></p>

</div>
</div>
</div>


<!-- HIDDEN SINGLE PAGE A4 IMAGE -->
<div id="safetyPage">

<img src="IMG-20260424-WA0007.jpg">

</div>



<script>
const STORAGE_KEY = "parcel_saved_addresses_v1";
const LEGACY_KEYS = ["savedToAddresses","addr"];


/* migrate old data */
function migrateOldAddresses(){

  let merged = [];

  try{
    merged.push(...JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
  }catch(e){}

  LEGACY_KEYS.forEach(function(k){

    try{
      merged.push(...JSON.parse(localStorage.getItem(k) || "[]"));
    }catch(e){}

  });

  const unique = [];

  merged.forEach(function(a){

    if(!a) return;

    if(!unique.some(function(u){
      return u.toLowerCase() === a.toLowerCase();
    })){
      unique.push(a);
    }

  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(unique));
}


/* update preview */
function updatePreview(){

  const box = document.getElementById("labelContent");

  box.style.fontFamily =
    document.getElementById("fontFamily").value;

  box.style.fontSize =
    document.getElementById("fontSize").value + "pt";

  box.style.lineHeight =
    document.getElementById("lineSpacing").value;

  document.getElementById("gap").style.height =
    document.getElementById("gapBetween").value + "px";

  document.getElementById("previewTo").textContent =
    document.getElementById("toText").value;

  document.getElementById("previewFrom").textContent =
    document.getElementById("fromText").value;
}


/* save address */
function saveAddress(){

  const txt =
    document.getElementById("toText").value.trim();

  if(!txt) return;

  let arr = [];

  try{
    arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }catch(e){
    arr = [];
  }

  if(!arr.some(function(a){
    return a.toLowerCase() === txt.toLowerCase();
  })){

    arr.push(txt);

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(arr)
    );
  }

  loadList();
}


/* load dropdown */
function loadList(){

  const sel =
    document.getElementById("savedAddresses");

  sel.innerHTML =
    '<option value="">-- Select Saved Address --</option>';

  let arr = [];

  try{
    arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }catch(e){
    arr = [];
  }

  const search =
    document.getElementById("toSearch").value.toLowerCase();

  arr.forEach(function(a,i){

    const first =
      a.trim().split(/\s+/)[0].toLowerCase();

    if(!search || first.includes(search)){

      const op =
        document.createElement("option");

      op.value = i;
      op.textContent = a.split("\n")[0];

      sel.appendChild(op);
    }

  });
}


/* load selected */
function loadSavedAddress(){

  const i =
    document.getElementById("savedAddresses").value;

  if(i === "") return;

  let arr = [];

  try{
    arr = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }catch(e){
    arr = [];
  }

  document.getElementById("toText").value =
    arr[i] || "";

  updatePreview();
}


/* parcel save pdf */
function savePDF(){

  updatePreview();
  saveAddress();

  html2pdf().set({

    margin:10,

    filename:"Parcel_Label.pdf",

    html2canvas:{
      scale:2
    },

    jsPDF:{
      unit:"mm",
      format:"a4",
      orientation:"portrait"
    },

    pagebreak:{
      mode:"avoid-all"
    }

  }).from(document.getElementById("labelPage")).save();
}


/* parcel print */
function printPDF(){

  updatePreview();
  saveAddress();

  html2pdf().set({

    margin:10,

    filename:"Parcel_Label.pdf",

    html2canvas:{
      scale:2
    },

    jsPDF:{
      unit:"mm",
      format:"a4",
      orientation:"portrait"
    },

    pagebreak:{
      mode:"avoid-all"
    }

  }).from(document.getElementById("labelPage"))
    .outputPdf("blob")
    .then(function(blob){

      const url = URL.createObjectURL(blob);
      const w = window.open(url);

      if(w){
        w.onload = function(){
          w.print();
        };
      }

    });
}


/* SAFETY LABEL : ALWAYS SINGLE PAGE A4 */
function printSafety(){

  const page =
    document.getElementById("safetyPage");

  page.style.display = "block";

  html2pdf().set({

    margin:0,

    filename:"Handle_With_Care.pdf",

    image:{
      type:"jpeg",
      quality:1
    },

    html2canvas:{
      scale:2,
      useCORS:true
    },

    jsPDF:{
      unit:"mm",
      format:"a4",
      orientation:"portrait"
    },

    pagebreak:{
      mode:["avoid-all","css","legacy"]
    }

  }).from(page).save()
    .then(function(){

      page.style.display = "none";

    });
}


/* events */
document.querySelectorAll(
  "input,textarea,select"
).forEach(function(el){

  el.addEventListener(
    "input",
    updatePreview
  );

});

document.getElementById("toSearch")
.addEventListener("input",loadList);


/* init */
window.onload = function(){

  migrateOldAddresses();
  loadList();
  updatePreview();

};
</script>

</body>
</html>
